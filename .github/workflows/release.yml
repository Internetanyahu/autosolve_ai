name: Publish Extension Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - background.js
      - popup.js
      - popup.html
      - options.js
      - options.html
      - updater.js
      - updater-page.js
      - content.js
      - prompt.txt
      - icons/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish Chrome extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension version
        id: version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=AutoSolveAI-v$VERSION-extension.zip" >> "$GITHUB_OUTPUT"

      - name: Build installable extension package
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          zip -r "$ASSET" \
            manifest.json \
            background.js \
            content.js \
            popup.html \
            popup.js \
            options.html \
            options.js \
            updater.html \
            updater-page.js \
            updater.js \
            prompt.txt \
            icons
          unzip -l "$ASSET"
          unzip -p "$ASSET" manifest.json | python -c 'import json,sys; print("Packaged extension version:", json.load(sys.stdin)["version"])'

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "AutoSolve AI $VERSION" \
              --generate-notes \
              --notes "Download AutoSolveAI-v$VERSION-extension.zip, extract it, then load the extracted folder in Chrome at chrome://extensions with Developer mode enabled."
          fi

      - name: Upload the actual Chrome extension
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh release upload "$TAG" "$ASSET" --clobber
