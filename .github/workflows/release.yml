name: Publish Extension Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - background.js
      - popup.js
      - popup.html
      - options.js
      - options.html
      - updater.js
      - content.js
      - prompt.txt
      - icons/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish versioned GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension version
        id: version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "AutoSolve AI $VERSION"             --generate-notes             --notes "AutoSolve AI version $VERSION. Download the source from this release or use the extension's built-in updater."
