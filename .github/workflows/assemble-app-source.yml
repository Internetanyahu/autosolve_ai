name: Assemble source-only project
on:
  push:
    paths:
      - "app-source/patches/**"
      - ".github/workflows/assemble-app-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract and apply corrected source
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find app-source -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          mkdir -p app-source/source
          unzip -q "$archive" -d app-source/source
          base64 -d app-source/patches/server.patch.gz.b64 | gzip -d > /tmp/server.patch
          base64 -d app-source/patches/App.patch.gz.b64 | gzip -d > /tmp/App.patch
          patch --batch --forward -d app-source/source -p1 < /tmp/server.patch
          patch --batch --forward -d app-source/source -p1 < /tmp/App.patch
          cat > app-source/source/README-SOURCE.md <<'EOF'
          # AutoSolve AI Studio source
          
          This directory contains the original full-stack AI Studio project source, kept separate from the browser extension at the repository root. It is source-only: this workflow does not deploy or publish the application and does not run tests.
          
          The corrected text-answer flow removes subject-specific answer assumptions, prevents automatic model rotation after provider failures, adds request timeouts and clearer errors, and keeps text mode separate from image input. The UI includes editable additional instructions.
          EOF
          rm -rf app-source/patches
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source/source
          git add -A app-source/patches
          git commit -m "Add corrected AI Studio source under app-source"
          git push origin HEAD:main
